name: Deploy Backend to EC2

on:
  push:
    branches:
    - main
    - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: .env
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ vars.DOCKERHUB_TOKEN }}

      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          # Importante: Garanta que o Dockerfile do backend esteja na raiz ou aponte o caminho correto
          file: ./dockerfile 
          push: true
          tags: zhunixy/meuplantao:latest

      - name: Build and push Migrations Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.Migrations
          push: true
          tags: zhunixy/meuplantao-migrations:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: .env
    steps:
      - name: SSH and Update EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/meuplantao
            docker compose pull backend migrations
            docker compose up -d postgres
            docker compose run --rm migrations
            docker compose up -d backend
            docker image prune -f
